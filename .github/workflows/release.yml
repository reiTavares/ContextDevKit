name: Release

# Publishes to npm when a version tag (v*) is pushed.
#
# One-time setup: add a repo secret NPM_TOKEN
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name: NPM_TOKEN
#   Value: an npm "Automation" / granular token with publish rights (bypass 2FA)
#
# To cut a release:
#   1. close the matching section in CHANGELOG.md and bump package.json/lock
#   2. merge the release PR to main
#   3. push the annotated vX.Y.Z tag from that main commit
# This workflow is the single publication path: it validates the exact changelog,
# package manifest, lockfile, and tag version; runs the gates; publishes npm with
# provenance; and creates the GitHub Release with the same complete notes. Do not
# publish npm manually as well.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release
  id-token: write # needed for npm publish --provenance (build attestation) [ADR-0031]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag, package and lockfile versions agree
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node --input-type=module - "$VERSION" <<'NODE'
          import { readFileSync } from 'node:fs';

          const version = process.argv[2];
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const rootLockVersion = lock?.packages?.['']?.version;

          const mismatches = [
            ['package.json', pkg.version],
            ['package-lock.json', lock.version],
            ['package-lock.json packages[""]', rootLockVersion],
          ].filter(([, actual]) => actual !== version);

          if (mismatches.length) {
            for (const [source, actual] of mismatches) {
              console.error(`${source}: expected ${version}, found ${String(actual)}`);
            }
            process.exit(1);
          }
          console.log(`version parity OK: ${version}`);
          NODE

      - name: Render complete release notes from CHANGELOG.md
        run: >-
          node tools/release/release-notes.mjs
          --version "${GITHUB_REF_NAME#v}"
          --changelog CHANGELOG.md
          --package package.json
          --output "${RUNNER_TEMP}/release-notes.md"

      # The publish path runs the SAME gate as CI [ADR-0031] — a release can no
      # longer ship on a red gate (the v1.9.0 mistake). One source: `npm run ci`.
      - name: CI gate (npm run ci)
        run: npm run ci

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --notes-file "${RUNNER_TEMP}/release-notes.md"
